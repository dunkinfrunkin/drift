services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drift
      POSTGRES_PASSWORD: drift
      POSTGRES_DB: drift_example
    ports:
      - "5433:5432"
    volumes:
      - ./seed:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drift -d drift_example"]
      interval: 2s
      timeout: 5s
      retries: 5
