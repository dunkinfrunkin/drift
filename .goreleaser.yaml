version: 2

builds:
  - main: ./cmd/drift
    binary: drift
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/frankchan/drift/internal/cli.Version={{.Version}}
      - -X github.com/frankchan/drift/internal/cli.Commit={{.Commit}}
      - -X github.com/frankchan/drift/internal/cli.Date={{.Date}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

brews:
  - repository:
      owner: dunkinfrunkin
      name: homebrew-tap
    directory: Formula
    homepage: https://github.com/frankchan/drift
    description: "Fast, open-source database migration tool with undo, dry-run, diff, and linting"
    license: MIT
    test: |
      system "#{bin}/drift", "version"

dockers:
  - image_templates:
      - "ghcr.io/dunkinfrunkin/drift:{{ .Version }}-amd64"
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
    dockerfile: Dockerfile.goreleaser
    goarch: amd64
  - image_templates:
      - "ghcr.io/dunkinfrunkin/drift:{{ .Version }}-arm64"
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
    dockerfile: Dockerfile.goreleaser
    goarch: arm64

docker_manifests:
  - name_template: "ghcr.io/dunkinfrunkin/drift:{{ .Version }}"
    image_templates:
      - "ghcr.io/dunkinfrunkin/drift:{{ .Version }}-amd64"
      - "ghcr.io/dunkinfrunkin/drift:{{ .Version }}-arm64"
  - name_template: "ghcr.io/dunkinfrunkin/drift:latest"
    image_templates:
      - "ghcr.io/dunkinfrunkin/drift:{{ .Version }}-amd64"
      - "ghcr.io/dunkinfrunkin/drift:{{ .Version }}-arm64"
